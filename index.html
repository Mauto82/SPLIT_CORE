<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projection Engine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #projection-terminal {
        display: none;
      }

      #terminal-app {
        display: none;
        width: min(100%, 960px);
        height: min(100%, 540px);
        grid-template-rows: 1fr auto;
        gap: 8px;
        padding: 12px;
        box-sizing: border-box;
      }

      #terminal-screen {
        margin: 0;
        white-space: pre-wrap;
        overflow: auto;
        color: #44d9e6;
        background: #000;
        font-family: monospace;
        border: 1px solid #44d9e6;
        padding: 10px;
      }

      #terminal-input {
        width: 100%;
        box-sizing: border-box;
        color: #44d9e6;
        background: #000;
        border: 1px solid #44d9e6;
        font-family: monospace;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="projection-canvas"></canvas>
      <pre id="projection-terminal"></pre>
      <section id="terminal-app">
        <pre id="terminal-screen"></pre>
        <input id="terminal-input" type="text" autocomplete="off" />
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
