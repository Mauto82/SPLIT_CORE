<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projection Engine</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #projection-canvas,
      #projection-terminal {
        position: absolute;
        inset: 0;
        margin: 0;
        display: none;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #engine-console {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 10;
        display: none;
        width: min(960px, calc(100vw - 24px));
        height: min(260px, calc(100vh - 24px));
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #44d9e6;
        background: rgba(0, 0, 0, 0.88);
      }

      #engine-console-output {
        margin: 0;
        min-height: 0;
        white-space: pre-wrap;
        overflow: auto;
        color: #44d9e6;
        background: #000;
        font-family: monospace;
        border: 1px solid #44d9e6;
        padding: 10px;
      }

      #engine-console-input {
        width: 100%;
        box-sizing: border-box;
        color: #44d9e6;
        background: #000;
        border: 1px solid #44d9e6;
        font-family: monospace;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="projection-canvas"></canvas>
      <pre id="projection-terminal"></pre>
      <section id="engine-console">
        <pre id="engine-console-output"></pre>
        <input id="engine-console-input" type="text" autocomplete="off" />
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
